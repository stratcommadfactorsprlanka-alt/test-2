<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Meridian — Plantation Field Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #efe9dc;
    --bg-alt: #e4dcc8;
    --ink: #2a211b;
    --ink-soft: #5a5044;
    --leaf: #3b5c42;
    --leaf-deep: #24402c;
    --amber: #b9803c;
    --line: #c9bfa6;
    --card: #f6f2e8;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  a { color: inherit; }

  .wrap {
    max-width: 780px;
    margin: 0 auto;
    padding: 48px 24px 96px;
  }

  header.masthead {
    border-bottom: 2px solid var(--ink);
    padding-bottom: 20px;
    margin-bottom: 8px;
  }

  .eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--leaf-deep);
    margin: 0 0 10px;
  }

  h1.title {
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-size: clamp(38px, 7vw, 58px);
    line-height: 1;
    margin: 0 0 6px;
    letter-spacing: -0.01em;
  }

  .subtitle {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 500;
    font-size: 17px;
    color: var(--ink-soft);
    margin: 0;
  }

  .stat-row {
    display: flex;
    gap: 36px;
    align-items: baseline;
    margin: 28px 0 36px;
    padding-bottom: 28px;
    border-bottom: 1px solid var(--line);
    flex-wrap: wrap;
  }

  .stat .num {
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-size: 40px;
    color: var(--leaf-deep);
    display: block;
    line-height: 1;
  }

  .stat .label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }

  .controls {
    display: flex;
    gap: 10px;
    margin-bottom: 32px;
    flex-wrap: wrap;
  }

  .controls input, .controls select {
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    padding: 10px 14px;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--ink);
    border-radius: 3px;
  }

  .controls input { flex: 1; min-width: 180px; }
  .controls input:focus, .controls select:focus {
    outline: 2px solid var(--leaf);
    outline-offset: 1px;
  }

  .entry {
    display: grid;
    grid-template-columns: 22px 1fr auto;
    gap: 14px;
    align-items: start;
    padding: 20px 0;
    border-bottom: 1px solid var(--line);
  }

  .entry:first-child { padding-top: 0; }

  .leaf-icon { margin-top: 5px; flex-shrink: 0; }
  .leaf-icon svg { display: block; }

  .entry-body .source {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--amber);
    margin-bottom: 5px;
  }

  .entry-body a.headline {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 19px;
    line-height: 1.3;
    text-decoration: none;
    display: inline;
    background-image: linear-gradient(var(--leaf), var(--leaf));
    background-repeat: no-repeat;
    background-position: 0 100%;
    background-size: 0% 1.5px;
    transition: background-size 0.25s ease;
  }
  .entry-body a.headline:hover {
    background-size: 100% 1.5px;
  }

  .entry-body .summary {
    font-size: 14px;
    color: var(--ink-soft);
    margin-top: 6px;
    line-height: 1.5;
  }

  .entry-time {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--ink-soft);
    white-space: nowrap;
    text-align: right;
    padding-top: 3px;
  }

  .empty, .loading {
    font-family: 'Fraunces', serif;
    font-style: italic;
    color: var(--ink-soft);
    padding: 40px 0;
    text-align: center;
  }

  footer {
    margin-top: 48px;
    padding-top: 20px;
    border-top: 1px solid var(--line);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--ink-soft);
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }
  footer a { color: var(--leaf-deep); }

  @media (prefers-reduced-motion: reduce) {
    .entry-body a.headline { transition: none; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="masthead">
    <p class="eyebrow">Field Report · Updated Daily</p>
    <h1 class="title">Meridian</h1>
    <p class="subtitle">A running log of what's moving across the plantation.</p>
  </header>

  <div class="stat-row" id="stat-row">
    <div class="stat">
      <span class="num" id="stat-count">—</span>
      <span class="label">Entries logged</span>
    </div>
    <div class="stat">
      <span class="num" id="stat-sources">—</span>
      <span class="label">Sources this week</span>
    </div>
    <div class="stat">
      <span class="num" id="stat-fresh">—</span>
      <span class="label">In the last 24h</span>
    </div>
  </div>

  <div class="controls">
    <input id="search" type="text" placeholder="Search entries…" />
    <select id="sourceFilter">
      <option value="">All sources</option>
    </select>
  </div>

  <div id="entries">
    <p class="loading">Reading the log…</p>
  </div>

  <footer>
    <span>Compiled from public reporting. Follow the link to read each piece in full.</span>
    <a href="feed.xml">Subscribe via RSS →</a>
  </footer>

</div>

<script>
const LEAF_FULL = `<svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
  <path d="M2 14C2 8 6 2 14 2C14 10 8 14 2 14Z" fill="currentColor"/>
  <path d="M2 14L9 7" stroke="#efe9dc" stroke-width="0.8" stroke-linecap="round"/>
</svg>`;

function leafOpacity(publishedDate) {
  const hours = (Date.now() - publishedDate.getTime()) / 36e5;
  if (hours <= 24) return 1;
  if (hours >= 24 * 7) return 0.22;
  return 1 - 0.78 * ((hours - 24) / (24 * 6));
}

function timeAgo(d) {
  const s = Math.floor((Date.now() - d.getTime()) / 1000);
  if (s < 60) return "just now";
  const m = Math.floor(s / 60);
  if (m < 60) return `${m}m ago`;
  const h = Math.floor(m / 60);
  if (h < 24) return `${h}h ago`;
  const days = Math.floor(h / 24);
  if (days < 7) return `${days}d ago`;
  return d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
}

let ALL_ITEMS = [];

async function loadFeed() {
  const container = document.getElementById("entries");
  try {
    const res = await fetch("feed.xml", { cache: "no-store" });
    const xmlText = await res.text();
    const xml = new DOMParser().parseFromString(xmlText, "text/xml");
    const items = Array.from(xml.querySelectorAll("item"));

    ALL_ITEMS = items.map(it => {
      const rawTitle = it.querySelector("title")?.textContent || "";
      const match = rawTitle.match(/^\[(.+?)\]\s*(.*)$/);
      const source = match ? match[1] : "Unknown";
      const title = match ? match[2] : rawTitle;
      const link = it.querySelector("link")?.textContent || "#";
      const desc = it.querySelector("description")?.textContent || "";
      const pubDateRaw = it.querySelector("pubDate")?.textContent;
      const pubDate = pubDateRaw ? new Date(pubDateRaw) : new Date();
      return { source, title, link, desc, pubDate };
    });

    populateSourceFilter(ALL_ITEMS);
    updateStats(ALL_ITEMS);
    render(ALL_ITEMS);
  } catch (e) {
    container.innerHTML = `<p class="empty">Could not load feed.xml — check it exists in this repo.</p>`;
    console.error(e);
  }
}

function populateSourceFilter(items) {
  const sel = document.getElementById("sourceFilter");
  const sources = [...new Set(items.map(i => i.source))].sort();
  sources.forEach(s => {
    const opt = document.createElement("option");
    opt.value = s;
    opt.textContent = s;
    sel.appendChild(opt);
  });
}

function updateStats(items) {
  document.getElementById("stat-count").textContent = items.length;
  document.getElementById("stat-sources").textContent = new Set(items.map(i => i.source)).size;
  const fresh = items.filter(i => (Date.now() - i.pubDate.getTime()) / 36e5 <= 24).length;
  document.getElementById("stat-fresh").textContent = fresh;
}

function render(items) {
  const container = document.getElementById("entries");
  if (!items.length) {
    container.innerHTML = `<p class="empty">No entries match. Try clearing the search or filter.</p>`;
    return;
  }
  const sorted = [...items].sort((a, b) => b.pubDate - a.pubDate);
  container.innerHTML = sorted.map(item => `
    <div class="entry">
      <div class="leaf-icon" style="color:#3b5c42; opacity:${leafOpacity(item.pubDate)}">${LEAF_FULL}</div>
      <div class="entry-body">
        <div class="source">${escapeHtml(item.source)}</div>
        <a class="headline" href="${escapeHtml(item.link)}" target="_blank" rel="noopener">${escapeHtml(item.title)}</a>
        ${item.desc ? `<div class="summary">${escapeHtml(truncate(item.desc, 160))}</div>` : ""}
      </div>
      <div class="entry-time">${timeAgo(item.pubDate)}</div>
    </div>
  `).join("");
}

function truncate(str, n) {
  return str.length > n ? str.slice(0, n).trim() + "…" : str;
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

function applyFilters() {
  const q = document.getElementById("search").value.toLowerCase();
  const src = document.getElementById("sourceFilter").value;
  const filtered = ALL_ITEMS.filter(i => {
    const matchesQuery = !q || i.title.toLowerCase().includes(q) || i.desc.toLowerCase().includes(q);
    const matchesSource = !src || i.source === src;
    return matchesQuery && matchesSource;
  });
  render(filtered);
}

document.getElementById("search").addEventListener("input", applyFilters);
document.getElementById("sourceFilter").addEventListener("change", applyFilters);

loadFeed();
</script>
</body>
</html>
